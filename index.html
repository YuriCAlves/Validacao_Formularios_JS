<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validação de formulários</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="funcoes.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Cadastro</h1>
    <p class="subtitulo">Atividade de validação de formulários — Parte 1</p>

    <form id="form-cadastro" novalidate>
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required minlength="3"
               autocomplete="name" aria-describedby="erro-nome">
        <span class="erro" id="erro-nome" aria-live="polite"></span>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required
               autocomplete="email" aria-describedby="erro-email">
        <span class="erro" id="erro-email" aria-live="polite"></span>
      </div>

      <div class="campo">
        <label for="usuario">Nome de usuário</label>
        <input type="text" id="usuario" name="usuario" required
               pattern="[A-Za-z0-9_]{4,16}" autocomplete="username"
               aria-describedby="regra-usuario erro-usuario">
        <small class="regra" id="regra-usuario">
          De 4 a 16 caracteres: letras de A a Z (sem acento), números e sublinhado (_). Sem espaços.
        </small>
        <span class="erro" id="erro-usuario" aria-live="polite"></span>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required
               minlength="12" maxlength="64" autocomplete="new-password"
               aria-describedby="regra-senha erro-senha">
        <small class="regra" id="regra-senha">Entre 12 e 64 caracteres. Espaços são permitidos.</small>
        <span class="erro" id="erro-senha" aria-live="polite"></span>
      </div>

      <div class="campo">
        <label for="confirmacao">Confirmação da senha</label>
        <input type="password" id="confirmacao" name="confirmacao" required
               autocomplete="new-password" aria-describedby="erro-confirmacao">
        <span class="erro" id="erro-confirmacao" aria-live="polite"></span>
      </div>

      <div class="campo campo-checkbox">
        <input type="checkbox" id="aceite" name="aceite" required
               aria-describedby="erro-aceite">
        <label for="aceite">Li e aceito as regras do exercício.</label>
        <span class="erro" id="erro-aceite" aria-live="polite"></span>
      </div>

      <button type="submit">Enviar</button>
    </form>

    <section id="resumo" class="resumo" aria-live="polite" hidden>
      <h2 id="resumo-titulo"></h2>
      <ul id="resumo-lista"></ul>
    </section>
  </main>
</body>
</html>
